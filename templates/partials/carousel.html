{% load static %}
<article data-carousel
  class="relative flex flex-col items-center justify-center sm:flex-row flex-shrink-0 overflow-hidden m-2 sm:m-6 max-w-7xl mx-auto shadow-xl rounded-xl"
  aria-roledescription="carousel" aria-label="Featured banners">
  <div class="rounded-full bg-gray-600 text-white absolute top-5 right-5 text-xs sm:text-sm px-2 text-center rounded-xl">
    <span data-carousel-index>1</span>/<span data-carousel-count>3</span>
  </div>

  {# The first banner is shown without JavaScript; carousel.js rotates them. #}
  <figure data-slide class="h-[10rem] sm:h-auto w-full sm:w-auto rounded-xl px-2 sm:px-0">
    <a href="{% url 'inventory' %}" target="_blank" rel="noopener" class="px-2 sm:px-4"><img class="rounded-xl" src="{% static 'banner1.jpg' %}" alt="Banner" /></a>
  </figure>
  <figure data-slide class="hidden h-[10rem] sm:h-auto w-full sm:w-auto rounded-xl px-2 sm:px-0">
    <a href="{% url 'inventory' %}" target="_blank" rel="noopener" class="px-2 sm:px-4"><img class="rounded-xl" src="{% static 'banner2.jpg' %}" alt="Banner" loading="lazy" /></a>
  </figure>
  <figure data-slide class="hidden h-[10rem] sm:h-auto w-full sm:w-auto rounded-xl px-2 sm:px-0">
    <a href="{% url 'inventory' %}" target="_blank" rel="noopener" class="px-2 sm:px-4"><img class="rounded-xl" src="{% static 'banner3.jpg' %}" alt="Banner" loading="lazy" /></a>
  </figure>
</article>
