name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run bandit -q -r inventory suffolkcoins manage.py
      - name: Migrations are in step with the models
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "true"
      - run: uv run pytest -q
      - name: The committed stylesheet is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code static/css/site.css

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The image builds
        run: docker build -t suffolkcoins .
